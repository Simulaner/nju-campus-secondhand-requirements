<form method="get" class="record-panel search-panel">
    <div class="filters">
        {% for field in form %}<div class="field">{{ field.as_field_group }}</div>{% endfor %}
    </div>
    <div class="form-actions">
        <button class="primary compact" type="submit">筛选</button>
        {% if request.GET %}<a href="{{ request.path }}">清除筛选</a>{% endif %}
    </div>
</form>
